# rtpmidid on the sequencer Pi.
# PCR32 (phone) connects in to "seqpi"; each incoming session gets its own ALSA port,
# named after the remote session ("PCR32"), which the engine profile matches.
[general]
alsa_name=rtpmidid
control=/tmp/rtpmidid.sock
log_level=info

[rtpmidi_announce]
name=seqpi
port=5004

# Bonjour is unreliable on the Windows machines here; connect by IP instead.
[rtpmidi_discover]
enabled=false

# Laptop with the VST instruments (rtpMIDI session "Instruments").
# Creates the ALSA port "Laptop" that engine/routing.json sends to.
[connect_to]
hostname=192.168.0.15
port=5004
name=Laptop
