plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.sequencer.pcr32'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.sequencer.pcr32'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '0.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.all {
            // Live session test against a real RTP-MIDI host runs only when a host is given.
            systemProperty 'rtp.host', System.getProperty('rtp.host', '')
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
